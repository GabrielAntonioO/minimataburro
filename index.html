<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MiniMataburro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden; /* ← Fija toda la página */
      font-family: -apple-system, 'Helvetica Neue', sans-serif;
      background: #1a1a1a;
      color: #ffffff;
    }
    body {
      display: flex;
      flex-direction: column;
      padding: 6px 8px 4px 8px;
      max-width: 400px;
      margin: 0 auto;
      height: 100vh;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch; /* Suavizado en watch */
      padding: 6px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
      touch-action: pan-y; /* Solo desplazamiento vertical */
    }
    .user {
      align-self: flex-end;
      background: #2a7a2a;
      color: #fff;
      padding: 8px 14px;
      border-radius: 16px 16px 0 16px;
      font-size: 20px; /* Achicado */
      max-width: 80%;
      word-wrap: break-word;
      line-height: 1.4;
    }
    .ai {
      align-self: flex-start;
      background: #2a2a2a;
      color: #ddd;
      padding: 8px 14px;
      border-radius: 16px 16px 16px 0;
      font-size: 20px; /* Achicado */
      max-width: 85%;
      word-wrap: break-word;
      line-height: 1.5;
    }
    .ai .speak-btn {
      background: #333;
      color: #4CAF50;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 20px;
      cursor: pointer;
      margin-left: 8px;
      vertical-align: middle;
      touch-action: manipulation;
    }
    .ai .speak-btn:active { background: #555; }
    footer {
      display: flex;
      gap: 6px;
      padding: 4px 0 2px 0;
      border-top: 1px solid #333;
      flex-shrink: 0;
      align-items: center;
      background: #1a1a1a; /* Fondo consistente */
    }
    input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #444;
      border-radius: 20px;
      background: #2a2a2a;
      color: #fff;
      font-size: 18px;
      outline: none;
      min-width: 0;
      height: 44px;
      touch-action: manipulation;
    }
    input::placeholder { color: #666; font-size: 16px; }
    input:focus { border-color: #4CAF50; }
    button {
      padding: 6px 12px;
      border: none;
      border-radius: 20px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      height: 44px;
      min-width: 44px;
      touch-action: manipulation;
    }
    button#send { background: #4CAF50; color: #fff; font-size: 20px; }
    button#clear { background: #d32f2f; color: #fff; font-size: 18px; min-width: 44px; }
    button#speak-all { background: #333; color: #4CAF50; font-size: 20px; min-width: 44px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    /* Scrollbar estilizada */
    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-track { background: #1a1a1a; }
    #chat::-webkit-scrollbar-thumb { background: #4CAF50; border-radius: 10px; }
  </style>
</head>
<body>

<!-- SIN HEADER, SIN AYUDA, SIN MENSAJE INICIAL -->

<div id="chat"></div>

<footer>
  <button id="clear" aria-label="Limpiar">✕</button>
  <input type="text" id="input" placeholder="Pregunta..." autofocus>
  <div class="footer-actions">
    <button id="speak-all" aria-label="Leer todo">🔊</button>
    <button id="send">➤</button>
  </div>
</footer>

<script>
  // ============ ELEMENTOS ============
  const chatDiv = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const clearBtn = document.getElementById('clear');
  const speakAllBtn = document.getElementById('speak-all');

  // ============ HISTORIAL (sin mensaje inicial) ============
  let messages = [];

  function iniciarChat() {
    messages = []; // Vacío, sin "Pregunta directa"
    render();
  }

  function render() {
    chatDiv.innerHTML = '';
    messages.forEach((msg) => {
      const div = document.createElement('div');
      div.className = msg.role;
      
      if (msg.role === 'ai') {
        const textSpan = document.createElement('span');
        textSpan.textContent = msg.content;
        div.appendChild(textSpan);
        
        const speakBtn = document.createElement('button');
        speakBtn.className = 'speak-btn';
        speakBtn.textContent = '🔊';
        speakBtn.onclick = (e) => {
          e.stopPropagation();
          speakText(msg.content);
        };
        div.appendChild(speakBtn);
      } else {
        div.textContent = msg.content;
      }
      
      chatDiv.appendChild(div);
    });
    chatDiv.scrollTop = chatDiv.scrollHeight;
  }

  // ============ SÍNTESIS DE VOZ ============
  let spanishVoice = null;

  function loadVoices() {
    const voices = window.speechSynthesis.getVoices();
    spanishVoice = voices.find(v => v.lang.startsWith('es'));
  }

  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
    setTimeout(loadVoices, 500);
  }

  function speakText(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'es-ES';
    utterance.rate = 0.8;
    utterance.pitch = 1.0;
    utterance.volume = 1.0;
    if (spanishVoice) utterance.voice = spanishVoice;
    window.speechSynthesis.speak(utterance);
  }

  function speakLastResponse() {
    for (let i = messages.length - 1; i >= 0; i--) {
      if (messages[i].role === 'ai') {
        speakText(messages[i].content);
        return;
      }
    }
  }

  // ============ ENVIAR MENSAJE ============
  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    messages.push({ role: 'user', content: text });
    render();
    input.value = '';
    sendBtn.disabled = true;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: messages.map(m => ({ role: m.role, content: m.content })) })
      });
      
      const data = await res.json();
      
      if (data.response) {
        messages.push({ role: 'ai', content: data.response });
        render();
        // speakText(data.response); // Descomentar para lectura automática
      } else if (data.error) {
        console.warn('Error de API:', data.error);
        messages.push({ role: 'ai', content: '⚠️ Error' });
        render();
      } else {
        throw new Error('Sin respuesta');
      }
    } catch (err) {
      console.error('Error:', err);
      messages.push({ role: 'ai', content: '⚠️ Error' });
      render();
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  // ============ EVENTOS ============
  clearBtn.onclick = () => {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    iniciarChat();
    input.focus();
  };

  speakAllBtn.onclick = speakLastResponse;
  sendBtn.onclick = sendMessage;
  input.onkeypress = (e) => {
    if (e.key === 'Enter') sendMessage();
  };

  // ============ INICIALIZAR ============
  iniciarChat();
  input.focus();
</script>
</body>
</html>

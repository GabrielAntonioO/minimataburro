<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Configuración básica para Apple Watch -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" id="viewport-meta">
  <title>MiniMataburro</title>
  <style>
    /* === RESET Y ESTRUCTURA === */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      touch-action: pan-y;
      font-family: -apple-system, 'Helvetica Neue', sans-serif;
      background: #1a1a1a;
      color: #ffffff;
    }

    body {
      max-width: 400px;
      margin: 0 auto;
      padding: 6px 8px 76px 8px;
      min-height: 100%;
    }

    /* === ÁREA DE CHAT === */
    #chat {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 6px 0;
    }

    /* === BURBUJAS DE MENSAJES === */
    .user {
      align-self: flex-end;
      background: #2a7a2a;
      color: #fff;
      padding: 8px 14px;
      border-radius: 16px 16px 0 16px;
      font-size: 20px;
      max-width: 80%;
      word-wrap: break-word;
      line-height: 1.4;
    }
    .ai {
      align-self: flex-start;
      background: #2a2a2a;
      color: #ddd;
      padding: 8px 14px;
      border-radius: 16px 16px 16px 0;
      font-size: 20px;
      max-width: 85%;
      word-wrap: break-word;
      line-height: 1.5;
    }

    /* === BOTÓN DE VOZ DENTRO DE CADA RESPUESTA === */
    .ai .speak-btn {
      background: #333;
      color: #4CAF50;
      border: none;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      font-size: 30px;
      cursor: pointer;
      margin-left: 8px;
      vertical-align: middle;
      touch-action: manipulation;
    }
    .ai .speak-btn:active { background: #555; }

    /* === PIE DE PÁGINA FIJO === */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 400px;
      margin: 0 auto;
      display: flex;
      gap: 4px;
      padding: 4px 6px 2px 6px;
      border-top: 1px solid #333;
      align-items: center;
      background: #1a1a1a;
    }

    input {
      flex-shrink: 0;
      width: 96px;
      padding: 0 6px;
      border: 1px solid #444;
      border-radius: 16px;
      background: #2a2a2a;
      color: #fff;
      font-size: 16px;
      outline: none;
      height: 60px;
      touch-action: manipulation;
    }
    input::placeholder { color: #666; font-size: 11px; }
    input:focus { border-color: #4CAF50; }

    button {
      flex-shrink: 0;
      padding: 0;
      border: none;
      border-radius: 30px;
      font-size: 24px;
      font-weight: 600;
      cursor: pointer;
      height: 60px;
      min-width: 60px;
      touch-action: manipulation;
    }
    button#send { background: #4CAF50; color: #fff; font-size: 27px; }
    button#speak-all { background: #333; color: #4CAF50; font-size: 27px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .footer-actions { display: flex; gap: 4px; flex-shrink: 0; }
  </style>
</head>
<body>

  <div id="chat"></div>

  <footer>
    <!-- ⬇️ EL BOTÓN ROJO CON LA CRUZ (✕) HA SIDO ELIMINADO ⬇️ -->
    <input type="text" id="input" placeholder="..." autofocus>
    <div class="footer-actions">
      <button id="speak-all" aria-label="Leer todo">🔊</button>
      <button id="send">➤</button>
    </div>
  </footer>

  <script>
    // ============================================================
    // 1. ELEMENTOS DEL DOM
    // ============================================================
    const chatDiv = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const speakAllBtn = document.getElementById('speak-all');
    const viewportMeta = document.getElementById('viewport-meta');

    // ============================================================
    // 1b. RESETEO FORZADO DE ZOOM (bug de dictado en watchOS/iOS)
    // ============================================================
    function resetZoom() {
      input.blur();
      if (document.activeElement && document.activeElement !== document.body) {
        document.activeElement.blur();
      }
      if (!viewportMeta) return;
      const content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no';
      const forceReflow = () => {
        const parent = viewportMeta.parentNode;
        parent.removeChild(viewportMeta);
        viewportMeta.setAttribute('content', content);
        parent.appendChild(viewportMeta);
      };
      forceReflow();
      setTimeout(forceReflow, 50);
      setTimeout(forceReflow, 150);
      setTimeout(forceReflow, 400);
      setTimeout(forceReflow, 800);
    }
    input.addEventListener('input', resetZoom);
    input.addEventListener('blur', resetZoom);
    input.addEventListener('change', resetZoom);

    // ============================================================
    // 2. ESTADO DEL CHAT (sin localStorage)
    // ============================================================
    let messages = [];

    function iniciarChat() {
      messages = [];
      render();
    }

    // ============================================================
    // 3. RENDERIZADO DE MENSAJES
    // ============================================================
    function render() {
      chatDiv.innerHTML = '';
      messages.forEach((msg) => {
        const div = document.createElement('div');
        div.className = msg.role;

        if (msg.role === 'ai') {
          const textSpan = document.createElement('span');
          textSpan.textContent = msg.content;
          div.appendChild(textSpan);

          const speakBtn = document.createElement('button');
          speakBtn.className = 'speak-btn';
          speakBtn.textContent = '🔊';
          speakBtn.onclick = (e) => {
            e.stopPropagation();
            speakText(msg.content);
          };
          div.appendChild(speakBtn);
        } else {
          div.textContent = msg.content;
        }

        chatDiv.appendChild(div);
      });
      window.scrollTo(0, document.body.scrollHeight);
    }

    // ============================================================
    // 4. SÍNTESIS DE VOZ (Web Speech API)
    // ============================================================
    let spanishVoice = null;

    function loadVoices() {
      const voices = window.speechSynthesis.getVoices();
      spanishVoice = voices.find(v => v.lang.startsWith('es'));
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      setTimeout(loadVoices, 500);
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'es-ES';
      utterance.rate = 0.8;
      utterance.pitch = 1.0;
      utterance.volume = 1.0;
      if (spanishVoice) utterance.voice = spanishVoice;
      window.speechSynthesis.speak(utterance);
    }

    function speakLastResponse() {
      for (let i = messages.length - 1; i >= 0; i--) {
        if (messages[i].role === 'ai') {
          speakText(messages[i].content);
          return;
        }
      }
    }

    // ============================================================
    // 5. ENVÍO DE MENSAJE AL BACKEND
    // ============================================================
    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      messages.push({ role: 'user', content: text });
      render();
      input.value = '';
      sendBtn.disabled = true;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: messages.map(m => ({ role: m.role, content: m.content }))
          })
        });

        const data = await res.json();

        if (data.response) {
          messages.push({ role: 'ai', content: data.response });
          render();
        } else if (data.error) {
          console.warn('Error de API:', data.error);
          messages.push({ role: 'ai', content: '⚠️ Error' });
          render();
        } else {
          throw new Error('Sin respuesta');
        }
      } catch (err) {
        console.error('Error:', err);
        messages.push({ role: 'ai', content: '⚠️ Error' });
        render();
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    // ============================================================
    // 6. EVENTOS DE INTERFAZ
    // ============================================================
    speakAllBtn.onclick = speakLastResponse;
    sendBtn.onclick = sendMessage;

    input.onkeypress = (e) => {
      if (e.key === 'Enter') sendMessage();
    };

    // ============================================================
    // 7. INICIALIZACIÓN
    // ============================================================
    iniciarChat();
    input.focus();
  </script>
</body>
</html>

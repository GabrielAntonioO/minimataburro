<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MiniMataburro</title>
  <style>
    /* Reset y configuración de la página para bloquear scroll fuera del chat */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden; /* Bloquea el scroll de la página completa */
      font-family: -apple-system, 'Helvetica Neue', sans-serif;
      background: #1a1a1a;
      color: #ffffff;
      -webkit-user-select: none; /* Evita selección de texto al tocar */
      user-select: none;
    }

    /* Contenedor principal que ocupa toda la altura */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh; /* Para dispositivos con notch */
      max-width: 400px;
      margin: 0 auto;
      padding: 8px 10px 6px 10px;
      background: #1a1a1a;
      position: relative;
    }

    /* Área de chat: ocupa todo el espacio disponible y permite scroll interno */
    #chat {
      flex: 1;
      overflow-y: auto; /* Solo esta área se desplaza */
      -webkit-overflow-scrolling: touch; /* Suaviza el scroll en iOS */
      padding: 4px 0 8px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0; /* Importante para que flex funcione bien */
      scroll-behavior: smooth;
    }

    /* Estilos de los mensajes con el mismo tamaño que el título anterior (~24px) */
    .user {
      align-self: flex-end;
      background: #2a7a2a;
      color: #fff;
      padding: 8px 14px;
      border-radius: 16px 16px 0 16px;
      font-size: 24px; /* Tamaño del título */
      max-width: 85%;
      word-wrap: break-word;
      line-height: 1.4;
    }

    .ai {
      align-self: flex-start;
      background: #2a2a2a;
      color: #ddd;
      padding: 8px 14px;
      border-radius: 16px 16px 16px 0;
      font-size: 24px; /* Tamaño del título */
      max-width: 90%;
      word-wrap: break-word;
      line-height: 1.5;
    }

    /* Botón de leer individual (dentro de cada respuesta IA) */
    .ai .speak-btn {
      background: #333;
      color: #4CAF50;
      border: none;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      font-size: 18px;
      cursor: pointer;
      margin-left: 8px;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .ai .speak-btn:active {
      background: #555;
    }

    /* Pie de página con el input y los botones */
    footer {
      display: flex;
      gap: 6px;
      padding: 6px 0 2px 0;
      border-top: 1px solid #333;
      flex-shrink: 0;
      align-items: center;
      background: #1a1a1a;
    }

    input {
      flex: 1;
      padding: 8px 14px;
      border: 1px solid #444;
      border-radius: 24px;
      background: #2a2a2a;
      color: #fff;
      font-size: 22px;
      outline: none;
      min-width: 0;
      height: 48px;
    }

    input::placeholder {
      color: #666;
      font-size: 18px;
    }

    input:focus {
      border-color: #4CAF50;
    }

    button {
      padding: 4px 12px;
      border: none;
      border-radius: 24px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      height: 48px;
      min-width: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button#send {
      background: #4CAF50;
      color: #fff;
      font-size: 22px;
    }

    button#clear {
      background: #d32f2f;
      color: #fff;
      font-size: 18px;
      min-width: 44px;
    }

    button#speak-all {
      background: #333;
      color: #4CAF50;
      font-size: 20px;
      min-width: 48px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Scrollbar personalizada solo para el chat (opcional) */
    #chat::-webkit-scrollbar {
      width: 3px;
    }

    #chat::-webkit-scrollbar-track {
      background: #1a1a1a;
    }

    #chat::-webkit-scrollbar-thumb {
      background: #4CAF50;
      border-radius: 10px;
    }

    /* Ocultar elementos que no se usan */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Contenedor del chat -->
    <div id="chat"></div>

    <!-- Footer con input y botones -->
    <footer>
      <button id="clear" aria-label="Limpiar">✕</button>
      <input type="text" id="input" placeholder="Pregunta..." autofocus>
      <button id="speak-all" aria-label="Leer todo">🔊</button>
      <button id="send">➤</button>
    </footer>
  </div>

  <script>
    // ============ ELEMENTOS ============
    const chatDiv = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const clearBtn = document.getElementById('clear');
    const speakAllBtn = document.getElementById('speak-all');

    // ============ HISTORIAL (NO PERSISTE) ============
    let messages = [];

    function load() {
      // Siempre comienza con un mensaje de bienvenida estático (no se guarda)
      messages = [{ role: 'ai', content: 'Pregunta directa.' }];
      render();
    }

    // No se guarda nada en localStorage

    function render() {
      chatDiv.innerHTML = '';
      messages.forEach((msg) => {
        const div = document.createElement('div');
        div.className = msg.role;

        if (msg.role === 'ai') {
          const textSpan = document.createElement('span');
          textSpan.textContent = msg.content;
          div.appendChild(textSpan);

          const speakBtn = document.createElement('button');
          speakBtn.className = 'speak-btn';
          speakBtn.textContent = '🔊';
          speakBtn.onclick = (e) => {
            e.stopPropagation();
            speakText(msg.content);
          };
          div.appendChild(speakBtn);
        } else {
          div.textContent = msg.content;
        }

        chatDiv.appendChild(div);
      });
      // Scroll al final del chat
      chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    // ============ SÍNTESIS DE VOZ ============
    let spanishVoice = null;

    function loadVoices() {
      const voices = window.speechSynthesis.getVoices();
      spanishVoice = voices.find(v => v.lang.startsWith('es'));
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      setTimeout(loadVoices, 500);
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'es-ES';
      utterance.rate = 0.8;
      utterance.pitch = 1.0;
      utterance.volume = 1.0;
      if (spanishVoice) utterance.voice = spanishVoice;
      window.speechSynthesis.speak(utterance);
    }

    function speakLastResponse() {
      for (let i = messages.length - 1; i >= 0; i--) {
        if (messages[i].role === 'ai') {
          speakText(messages[i].content);
          return;
        }
      }
    }

    // ============ ENVIAR MENSAJE ============
    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      messages.push({ role: 'user', content: text });
      render();
      input.value = '';
      sendBtn.disabled = true;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: messages.map(m => ({ role: m.role, content: m.content })) })
        });

        const data = await res.json();

        if (data.response) {
          messages.push({ role: 'ai', content: data.response });
          render();
          // speakText(data.response); // Opcional: lectura automática
        } else if (data.error) {
          console.warn('Error de API:', data.error);
          messages.push({ role: 'ai', content: '⚠️ Error' });
          render();
        } else {
          throw new Error('Sin respuesta');
        }
      } catch (err) {
        console.error('Error:', err);
        messages.push({ role: 'ai', content: '⚠️ Error' });
        render();
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    // ============ EVENTOS ============
    clearBtn.onclick = () => {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      messages = [{ role: 'ai', content: 'Pregunta directa.' }];
      render();
      input.focus();
    };

    speakAllBtn.onclick = speakLastResponse;
    sendBtn.onclick = sendMessage;
    input.onkeypress = (e) => {
      if (e.key === 'Enter') sendMessage();
    };

    // ============ INICIALIZAR ============
    load();
    input.focus();

    // Bloquear cualquier evento de scroll no deseado en el body
    document.addEventListener('touchmove', function(e) {
      // Si el toque no está dentro del chat, se previene el scroll
      const target = e.target;
      if (!chatDiv.contains(target) && !input.contains(target)) {
        e.preventDefault();
      }
    }, { passive: false });

    // También para la rueda del mouse (opcional)
    document.addEventListener('wheel', function(e) {
      const target = e.target;
      if (!chatDiv.contains(target) && !input.contains(target)) {
        e.preventDefault();
      }
    }, { passive: false });
  </script>
</body>
</html>

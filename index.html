<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Configuración básica para Apple Watch -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MiniMataburro</title>
  <style>
    /* === RESET Y ESTRUCTURA === */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow-x: hidden;          /* Bloquea el desplazamiento horizontal en toda la página */
      overflow-y: auto;            /* El documento entero es lo único que se desplaza (vertical) */
      -webkit-overflow-scrolling: touch; /* Suavizado en watchOS */
      touch-action: pan-y;         /* Solo permite gesto vertical en toda la página */
      font-family: -apple-system, 'Helvetica Neue', sans-serif;
      background: #1a1a1a;
      color: #ffffff;
    }

    body {
      max-width: 400px;            /* Para que en pantallas grandes no se estire */
      margin: 0 auto;
      padding: 6px 8px 60px 8px;   /* padding-bottom = alto aprox. del footer fijo */
      min-height: 100%;
    }

    /* === ÁREA DE CHAT (ya no tiene su propio scroll) === */
    #chat {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 6px 0;
    }

    /* === BURBUJAS DE MENSAJES === */
    .user {
      align-self: flex-end;
      background: #2a7a2a;
      color: #fff;
      padding: 8px 14px;
      border-radius: 16px 16px 0 16px;
      font-size: 20px;           /* Tamaño legible en watch */
      max-width: 80%;
      word-wrap: break-word;
      line-height: 1.4;
    }
    .ai {
      align-self: flex-start;
      background: #2a2a2a;
      color: #ddd;
      padding: 8px 14px;
      border-radius: 16px 16px 16px 0;
      font-size: 20px;
      max-width: 85%;
      word-wrap: break-word;
      line-height: 1.5;
    }

    /* === BOTÓN DE VOZ DENTRO DE CADA RESPUESTA === */
    .ai .speak-btn {
      background: #333;
      color: #4CAF50;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 20px;
      cursor: pointer;
      margin-left: 8px;
      vertical-align: middle;
      touch-action: manipulation; /* Mejora respuesta táctil */
    }
    .ai .speak-btn:active { background: #555; }

    /* === PIE DE PÁGINA FIJO (input y botones) === */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 400px;
      margin: 0 auto;
      display: flex;
      gap: 4px;
      padding: 4px 6px 2px 6px;
      border-top: 1px solid #333;
      align-items: center;
      background: #1a1a1a;
    }
    input {
      flex-shrink: 0;
      width: 48px;              /* Chico a propósito: solo indica que hay texto dictado */
      padding: 0 6px;
      border: 1px solid #444;
      border-radius: 16px;
      background: #2a2a2a;
      color: #fff;
      font-size: 13px;
      outline: none;
      height: 40px;
      touch-action: manipulation;
    }
    input::placeholder { color: #666; font-size: 11px; }
    input:focus { border-color: #4CAF50; }

    button {
      flex-shrink: 0;
      padding: 0;
      border: none;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      height: 40px;
      min-width: 40px;
      touch-action: manipulation;
    }
    button#send { background: #4CAF50; color: #fff; font-size: 18px; }
    button#clear { background: #d32f2f; color: #fff; font-size: 16px; }
    button#speak-all { background: #333; color: #4CAF50; font-size: 18px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .footer-actions { display: flex; gap: 4px; flex-shrink: 0; }
  </style>
</head>
<body>

  <!-- SIN HEADER, SIN MENSAJE INICIAL, SIN TEXTO DE AYUDA -->

  <div id="chat"></div>

  <footer>
    <button id="clear" aria-label="Limpiar">✕</button>
    <input type="text" id="input" placeholder="..." autofocus>
    <div class="footer-actions">
      <button id="speak-all" aria-label="Leer todo">🔊</button>
      <button id="send">➤</button>
    </div>
  </footer>

  <script>
    // ============================================================
    // 1. ELEMENTOS DEL DOM
    // ============================================================
    const chatDiv = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const clearBtn = document.getElementById('clear');
    const speakAllBtn = document.getElementById('speak-all');

    // ============================================================
    // 2. ESTADO DEL CHAT (sin localStorage)
    // ============================================================
    let messages = []; // Array de objetos { role: 'user'|'ai', content: 'texto' }

    // Inicia el chat vacío (sin mensaje de bienvenida)
    function iniciarChat() {
      messages = [];
      render();
    }

    // ============================================================
    // 3. RENDERIZADO DE MENSAJES
    // ============================================================
    function render() {
      chatDiv.innerHTML = '';
      messages.forEach((msg) => {
        const div = document.createElement('div');
        div.className = msg.role; // 'user' o 'ai'

        if (msg.role === 'ai') {
          // Texto de la respuesta
          const textSpan = document.createElement('span');
          textSpan.textContent = msg.content;
          div.appendChild(textSpan);

          // Botón para leer esta respuesta en voz alta
          const speakBtn = document.createElement('button');
          speakBtn.className = 'speak-btn';
          speakBtn.textContent = '🔊';
          speakBtn.onclick = (e) => {
            e.stopPropagation();
            speakText(msg.content);
          };
          div.appendChild(speakBtn);
        } else {
          // Mensaje de usuario (solo texto)
          div.textContent = msg.content;
        }

        chatDiv.appendChild(div);
      });
      // Auto-scroll al final: ahora se hace sobre todo el documento,
      // que es el único elemento con scroll real.
      window.scrollTo(0, document.body.scrollHeight);
    }

    // ============================================================
    // 4. SÍNTESIS DE VOZ (Web Speech API)
    // ============================================================
    let spanishVoice = null;

    // Carga las voces disponibles y busca una en español
    function loadVoices() {
      const voices = window.speechSynthesis.getVoices();
      spanishVoice = voices.find(v => v.lang.startsWith('es'));
    }

    // Si el navegador soporta voz, configuramos el evento
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      setTimeout(loadVoices, 500); // Fallback para algunos navegadores
    }

    // Función para hablar un texto
    function speakText(text) {
      if (!('speechSynthesis' in window)) return; // Sin soporte, no hace nada
      window.speechSynthesis.cancel(); // Corta cualquier voz anterior
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'es-ES';
      utterance.rate = 0.8;   // Velocidad adecuada para claridad
      utterance.pitch = 1.0;
      utterance.volume = 1.0;
      if (spanishVoice) utterance.voice = spanishVoice;
      window.speechSynthesis.speak(utterance);
    }

    // Lee la última respuesta de la IA (botón global 🔊)
    function speakLastResponse() {
      for (let i = messages.length - 1; i >= 0; i--) {
        if (messages[i].role === 'ai') {
          speakText(messages[i].content);
          return;
        }
      }
    }

    // ============================================================
    // 5. ENVÍO DE MENSAJE AL BACKEND
    // ============================================================
    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return; // No envía mensajes vacíos

      // Agregar mensaje del usuario al historial y renderizar
      messages.push({ role: 'user', content: text });
      render();
      input.value = '';
      sendBtn.disabled = true;

      try {
        // Llamada al endpoint de Vercel
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: messages.map(m => ({ role: m.role, content: m.content }))
          })
        });

        const data = await res.json();

        if (data.response) {
          // Respuesta exitosa
          messages.push({ role: 'ai', content: data.response });
          render();
          // (Opcional) speakText(data.response); // Lectura automática
        } else if (data.error) {
          console.warn('Error de API:', data.error);
          messages.push({ role: 'ai', content: '⚠️ Error' });
          render();
        } else {
          throw new Error('Sin respuesta');
        }
      } catch (err) {
        console.error('Error:', err);
        messages.push({ role: 'ai', content: '⚠️ Error' });
        render();
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    // ============================================================
    // 6. EVENTOS DE INTERFAZ
    // ============================================================
    // Botón limpiar: borra el historial y reinicia el chat
    clearBtn.onclick = () => {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      iniciarChat();
      input.focus();
    };

    // Botón leer todo (última respuesta)
    speakAllBtn.onclick = speakLastResponse;

    // Botón enviar
    sendBtn.onclick = sendMessage;

    // Enviar con tecla Enter
    input.onkeypress = (e) => {
      if (e.key === 'Enter') sendMessage();
    };

    // ============================================================
    // 7. INICIALIZACIÓN
    // ============================================================
    iniciarChat();
    input.focus();
  </script>
</body>
</html>
